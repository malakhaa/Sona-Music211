name: Build Sona Music APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_native_ndk:
        description: 'Compile C++ NDK/Oboe DSP engine'
        required: false
        default: true
        type: boolean

jobs:
  build-apk:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK, Licenses & NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=$(command -v sdkmanager || ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            if [ "${{ inputs.build_native_ndk != false }}" = "true" ]; then
              if [ ! -d "$SDK_ROOT/cmake" ] || [ -z "$(ls -A "$SDK_ROOT/cmake" 2>/dev/null)" ]; then
                "$SDKMANAGER" "cmake;3.22.1"
              fi
              if [ ! -d "$SDK_ROOT/ndk" ] || [ -z "$(ls -A "$SDK_ROOT/ndk" 2>/dev/null)" ]; then
                LATEST_NDK=$("$SDKMANAGER" --list 2>/dev/null | grep -oE 'ndk;[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n 1 || true)
                if [ -n "$LATEST_NDK" ]; then
                  "$SDKMANAGER" "$LATEST_NDK"
                fi
              fi
            fi
          fi
          echo "SDK NDKs:" && ls -1 "$SDK_ROOT/ndk" 2>/dev/null || true
          echo "SDK CMakes:" && ls -1 "$SDK_ROOT/cmake" 2>/dev/null || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Restore Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sona-music-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Decode Release Keystore (Optional)
        id: release_check
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Signed Release APK (Optional)
        if: steps.release_check.outputs.ready == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload Release APK Artifact
        if: steps.release_check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sona-music-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Attach APK to GitHub Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
